<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YouTube Manager</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>YouTube Manager</h1>
    <div class="header-actions">
      <button id="autoplayBtn" title="On: Play jumps between bookmarks and stops after the last one. Off: Play just plays the video normally from that point.">AutoPlay Bookmark: On</button>
      <button id="manageBtn" title="Open the full library in a new tab">📚 Library</button>
      <button id="syncBtn" title="Sync with Gist">⟲ Sync<span id="syncDot" class="sync-dot"></span></button>
      <button id="optionsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <label class="checkbox-row" title="Hides the bookmark panel, playlist panel, and seek-bar markers on YouTube video pages. Bookmarks and tags are kept and still sync — this only hides the UI. Syncs across your devices.">
    <input type="checkbox" id="extensionEnabledInput" checked>
    Show bookmark panel on YouTube
  </label>

  <p id="notOnVideo" class="hint" hidden>
    Open a YouTube video to see its bookmarks here. Use the bookmark panel
    above the video title, or the 📚 Library button above to manage every
    video at once.
  </p>

  <div id="videoHeader" class="video-header" hidden></div>

  <div id="controls" hidden>
    <input id="searchInput" type="search" placeholder="Search this video's labels…">
  </div>

  <ul id="videoList" class="clip-list"></ul>
  <p id="emptyState" class="hint" hidden>No bookmarks on this video yet.</p>
  <p id="statusMsg" class="status" hidden></p>

  <script src="js/storage.js"></script>
  <script src="js/gist.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/row.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
