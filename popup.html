<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>YouTube Manager</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>YouTube Manager</h1>
    <div class="header-actions">
      <button id="autoplayBtn" title="Toggle autoplay on jump-to actions">Autoplay: On</button>
      <button id="syncBtn" title="Sync with Gist">⟲ Sync</button>
      <button id="optionsBtn" title="Settings">⚙</button>
    </div>
  </header>

  <p class="hint">
    Use the bookmark panel above the video title on any YouTube watch page to
    mark start/end points, or right-click a video page for a quick start.
  </p>

  <div id="controls">
    <input id="searchInput" type="search" placeholder="Search title, channel, notes…">
  </div>

  <div id="videoList"></div>
  <p id="emptyState" class="hint" hidden>No bookmarks yet.</p>
  <p id="statusMsg" class="status" hidden></p>

  <script src="js/storage.js"></script>
  <script src="js/gist.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/row.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>
